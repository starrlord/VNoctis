# Additional diagnostics only; the UI image retains its production server config.
log_format cache_test escape=json '{"time":$msec,"method":"$request_method","uri":"$request_uri","status":$status,"bodyBytes":$body_bytes_sent,"seconds":$request_time,"range":"$http_range","etag":"$http_if_none_match"}';
access_log /var/log/nginx/cache-test.jsonl cache_test;
